<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en-us">

<head>
  {% include head.html %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ site.author.name }}",
    "url": "{{ site.author.url }}",
    "image": "{{ site.avatar }}",
    "sameAs": [
      "{{ site.author.github }}",
      "{{ site.author.linkedin }}",
      "{{ site.author.twitter }}"
    ]
  }
  </script>
  {% if page.url == "/" %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "{{ site.name }}",
    "url": "{{ site.url }}",
    "description": {{ site.description | jsonify }},
    "author": { "@type": "Person", "name": "{{ site.author.name }}" },
    "publisher": { "@type": "Person", "name": "{{ site.author.name }}", "url": "{{ site.author.url }}" }
  }
  </script>
  {% endif %}
</head>

<body class="site-canvas">
  <div class="site-shell">
    {% include header.html %}
    {{ content }}
    <div class="site-shell-gap site-shell-gap--footer"></div>
    {% include footer.html %}
  </div>
  {% include scripts.html %}
</body>

</html>
