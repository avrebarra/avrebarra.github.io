  <style>
    :root {
      --bg: #fcfcfb;
      --text: #171717;
      --muted: #737373;
      --muted2: #a3a3a3;
      --border: #e5e5e5;
      --border2: rgba(229, 229, 229, .8);
      --sel: #e5e5e5
    }

    *,
    *:before,
    *:after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      scroll-behavior: smooth
    }

    body {
      font-family: Instrument Sans, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      color: #262626;
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility
    }

    ::-moz-selection {
      background: var(--sel)
    }

    ::selection {
      background: var(--sel)
    }

    a {
      color: inherit
    }

    code,
    kbd {
      font-family: IBM Plex Mono, monospace
    }

    code {
      font-size: .875em
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border-radius: 999px;
      font-family: Instrument Sans, sans-serif;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: background .15s, border-color .15s, color .15s, box-shadow .15s, transform .15s
    }

    .btn:focus-visible,
    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 2px;
      border-radius: 2px
    }

    .btn-dark {
      background: #171717;
      color: #fff;
      padding: 12px 24px;
      box-shadow: 0 1px 2px #00000014, 0 8px 24px #0000001a
    }

    .btn-dark:hover {
      background: #262626;
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 2px 4px #00000014, 0 12px 32px #0000001f
    }

    .btn-ghost {
      background: #fff;
      color: #404040;
      border: 1px solid #d4d4d4;
      padding: 12px 24px
    }

    .btn-ghost:hover {
      border-color: #737373;
      color: #171717
    }

    .btn-sm {
      padding: 8px 16px;
      font-size: 13px;
      gap: 8px;
      box-shadow: none
    }

    .btn-sm:hover {
      transform: none;
      box-shadow: none
    }

    .site-nav {
      max-width: 64rem;
      margin: 0 auto;
      padding: 28px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .site-nav-brand {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -.03em;
      color: #171717;
      text-decoration: none
    }

    .site-nav-links {
      display: flex;
      gap: 32px;
      font-size: 13px;
      color: #737373
    }

    .site-nav-links a {
      text-decoration: none;
      transition: color .15s
    }

    .site-nav-links a:hover {
      color: #171717
    }

    @media (max-width: 640px) {
      .site-nav-links {
        display: none
      }
    }

    .hero {
      max-width: 64rem;
      margin: 0 auto;
      padding: 80px 24px;
      text-align: center
    }

    @media (min-width: 768px) {
      .hero {
        padding-top: 112px
      }
    }

    .hero-eyebrow {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .25em;
      color: #a3a3a3
    }

    .hero-headline {
      margin: 32px auto 0;
      max-width: 42rem;
      font-size: 2.6rem;
      font-weight: 500;
      line-height: 1.12;
      letter-spacing: -.03em;
      color: #171717;
      text-wrap: balance
    }

    @media (min-width: 768px) {
      .hero-headline {
        font-size: 3.75rem
      }
    }

    .hero-headline span {
      color: #a3a3a3
    }

    .hero-sub {
      margin: 28px auto 0;
      max-width: 28rem;
      font-size: 15px;
      line-height: 1.65;
      color: #737373
    }

    .hero-ctas {
      margin-top: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px
    }

    @media (min-width: 640px) {
      .hero-ctas {
        flex-direction: row
      }
    }

    .hero-ctas-hint {
      font-size: 14px;
      color: #a3a3a3
    }

    .hero-ctas-hint kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: IBM Plex Mono, monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .04em;
      color: #404040;
      background: #fff;
      border: 1px solid #d4d4d4;
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 1px 6px;
      line-height: 1.4;
      box-shadow: 0 1px #0000000a
    }

    .hero-pitches {
      margin: 80px auto 0;
      max-width: 28rem
    }

    .pitch-tabs {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 24px;
      font-size: 13px
    }

    .pitch-tab {
      background: none;
      border: none;
      font-family: Instrument Sans, sans-serif;
      font-size: 13px;
      cursor: pointer;
      padding: 0 0 4px;
      border-bottom: 1px solid transparent;
      transition: color .15s;
      color: #a3a3a3
    }

    .pitch-tab:hover {
      color: #737373
    }

    .pitch-tab.active {
      color: #171717;
      border-bottom-color: #171717;
      text-underline-offset: 8px
    }

    .pitch-copy {
      margin-top: 32px;
      min-height: 96px
    }

    .pitch-title {
      font-size: 18px;
      font-weight: 500;
      color: #171717;
      line-height: 1.4
    }

    .pitch-sub {
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.65;
      color: #737373
    }

    .pitch-sub code {
      font-size: 12px;
      background: #f5f5f5;
      padding: 1px 5px;
      border-radius: 4px
    }

    .notes-section {
      border-top: 1px solid var(--border2);
      max-width: 64rem;
      margin: 0 auto;
      padding: 96px clamp(24px, 6vw, 40px)
    }

    .notes-section h2 {
      text-align: center;
      font-size: 24px;
      font-weight: 500;
      letter-spacing: -.02em;
      color: #171717
    }

    @media (min-width: 768px) {
      .notes-section h2 {
        font-size: 30px
      }
    }

    .notes-grid {
      margin: 56px auto 0;
      max-width: 44rem;
      display: grid;
      gap: 48px
    }

    @media (min-width: 640px) {
      .notes-grid {
        grid-template-columns: repeat(3, 1fr);
        -moz-column-gap: 56px;
        column-gap: 56px
      }
    }

    .notes-num {
      font-family: IBM Plex Mono, monospace;
      font-size: 12px;
      color: #a3a3a3
    }

    .notes-grid h3 {
      margin-top: 12px;
      font-size: 15px;
      font-weight: 500;
      color: #171717
    }

    .notes-grid p {
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.65;
      color: #737373
    }

    .notes-grid code {
      font-size: 12px
    }

    .faq-section {
      border-top: 1px solid var(--border2);
      padding: 96px clamp(24px, 6vw, 40px)
    }

    .faq-section h2 {
      text-align: center;
      font-size: 24px;
      font-weight: 500;
      letter-spacing: -.02em;
      color: #171717
    }

    .faq-list {
      margin: 40px auto 0;
      max-width: 36rem
    }

    .faq-list details {
      border-bottom: 1px solid var(--border2);
      padding: 20px 0
    }

    .faq-list details:first-child {
      border-top: 1px solid var(--border2)
    }

    .faq-list summary {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font-size: 14px;
      color: #262626;
      cursor: pointer
    }

    .faq-list summary::-webkit-details-marker {
      display: none
    }

    .faq-plus {
      font-size: 16px;
      line-height: 1;
      color: #d4d4d4;
      transition: transform .2s;
      flex-shrink: 0
    }

    details[open] .faq-plus {
      transform: rotate(45deg)
    }

    .faq-answer {
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.65;
      color: #737373
    }

    .faq-answer code {
      font-size: 12px;
      background: #f5f5f5;
      padding: 1px 5px;
      border-radius: 4px
    }

    .closing {
      border-top: 1px solid var(--border2);
      max-width: 64rem;
      margin: 0 auto;
      padding: 112px clamp(24px, 6vw, 40px);
      text-align: center
    }

    .closing h2 {
      max-width: 36rem;
      margin: 0 auto;
      font-size: 24px;
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: -.02em;
      color: #171717;
      text-wrap: balance
    }

    @media (min-width: 768px) {
      .closing h2 {
        font-size: 30px
      }
    }

    .closing h2 span {
      color: #a3a3a3
    }

    .closing-ctas {
      margin-top: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px
    }

    @media (min-width: 640px) {
      .closing-ctas {
        flex-direction: row
      }
    }

    .footer {
      border-top: 1px solid var(--border2);
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: #a3a3a3
    }

    @media (min-width: 768px) {
      .footer {
        flex-direction: row;
        justify-content: space-between;
        max-width: 64rem;
        margin: 0 auto
      }
    }

    .footer-brand {
      font-size: 15px;
      font-weight: 500;
      color: #525252
    }

    .footer-meta {
      color: #a3a3a3
    }
  </style>
</head>

<body>
  <div id="app"></div>
</body>

</html>
